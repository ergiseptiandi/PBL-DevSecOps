name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: 🔐 Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks butuh history untuk mendeteksi secret lama
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: 🐍 Backend (Bandit · pip-audit · Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Bandit — SAST untuk Python
        run: bandit -r app -ll
      - name: pip-audit — vulnerability dependency Python
        run: pip-audit -r requirements.txt --desc on
      - name: Pytest — unit & security test
        run: pytest

  frontend:
    name: ▲ Frontend (ESLint · npm audit · Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: npm audit — vulnerability dependency JS (high+)
        run: npm audit --audit-level=high
      - name: Build produksi
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  sast:
    name: 🔎 Semgrep (SAST multi-bahasa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: pip install semgrep
      - name: Semgrep scan (python + javascript + secrets)
        run: >
          semgrep scan
          --config p/python --config p/javascript --config p/secrets
          --error --quiet

  trivy:
    name: 🛡️ Trivy (dependency & misconfig scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan filesystem (vulnerability dependency)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table
      - name: Scan config (Dockerfile & compose misconfig)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

  deploy:
    name: 🚀 Deploy ke VPS (self-hosted runner)
    needs: [secret-scan, backend, frontend, sast, trivy]
    # Aktifkan setelah runner terpasang di VPS — lihat docs/VPS-DEPLOY.md
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      # .env di server adalah sumber utama (sudah berisi kredensial Postgres
      # shared, HTTP_PORT=8080, dst). Step ini hanya memastikan file ada &
      # menimpa nilai yang MEMANG dikelola via GitHub Actions Variables.
      # JANGAN menimpa POSTGRES_* dari sini — kredensial tidak disimpan di GH.
      - name: Sinkronkan .env server (non-destruktif)
        run: |
          touch .env
          chmod 600 .env
          grep -q '^BACKEND_BLUE_VERSION=' .env || echo "BACKEND_BLUE_VERSION=1.0.0" >> .env
          grep -q '^BACKEND_GREEN_VERSION=' .env || echo "BACKEND_GREEN_VERSION=1.1.0" >> .env
          grep -q '^ACTIVE_BACKEND=' .env || echo "ACTIVE_BACKEND=backend-blue:8000" >> .env
          grep -q '^HTTP_PORT=' .env || echo "HTTP_PORT=8080" >> .env
      - name: Build & restart container
        run: docker compose up -d --build
      - name: Smoke test
        run: |
          sleep 5
          PORT=$(grep '^HTTP_PORT=' .env | cut -d= -f2)
          curl -fsS "http://localhost:${PORT:-8080}/api/health"
          echo
          curl -fsS "http://localhost:${PORT:-8080}/api/version"
