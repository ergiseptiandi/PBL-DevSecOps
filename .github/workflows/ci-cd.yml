name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: 🔐 Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks butuh history untuk mendeteksi secret lama
      - name: Gitleaks (container ghcr.io)
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --redact -f text --exit-code 1

  backend:
    name: 🐍 Backend (Bandit · pip-audit · Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Bandit — SAST untuk Python
        run: bandit -r app -ll
      - name: pip-audit — vulnerability dependency Python
        run: pip-audit -r requirements.txt --desc on
      - name: Pytest — unit & security test
        run: pytest

  frontend:
    name: ▲ Frontend (ESLint · npm audit · Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: npm audit — vulnerability dependency JS (high+)
        run: npm audit --audit-level=high
      - name: Build produksi
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  sast:
    name: 🔎 Semgrep (SAST multi-bahasa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: pip install semgrep
      - name: Semgrep scan (python + javascript + secrets)
        run: >
          semgrep scan
          --config p/python --config p/javascript --config p/secrets
          --error --quiet

  trivy:
    name: 🛡️ Trivy (dependency & misconfig scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan filesystem (vulnerability dependency)
        run: |
          docker run --rm -v "$PWD:/src:ro" ghcr.io/aquasecurity/trivy:latest \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 /src
      - name: Scan config (Dockerfile & compose misconfig)
        run: |
          docker run --rm -v "$PWD:/src:ro" ghcr.io/aquasecurity/trivy:latest \
            config --severity HIGH,CRITICAL --exit-code 1 /src

  deploy:
    name: 🚀 Deploy ke VPS (self-hosted runner)
    needs: [secret-scan, backend, frontend, sast, trivy]
    # Aktifkan setelah runner terpasang di VPS — lihat docs/VPS-DEPLOY.md
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v5
      # .env di server adalah sumber utama (kredensial tidak disimpan di GitHub);
      # step ini hanya menambah variabel yang belum ada.
      - name: Sinkronkan .env server (non-destruktif)
        run: |
          touch .env
          chmod 600 .env
          grep -q '^BACKEND_BLUE_VERSION=' .env || echo "BACKEND_BLUE_VERSION=1.0.0" >> .env
          grep -q '^BACKEND_GREEN_VERSION=' .env || echo "BACKEND_GREEN_VERSION=1.1.0" >> .env
          grep -q '^ACTIVE_BACKEND=' .env || echo "ACTIVE_BACKEND=backend-blue:8000" >> .env
          grep -q '^HTTP_PORT=' .env || echo "HTTP_PORT=8080" >> .env
      - name: Build & restart container
        run: docker compose up -d --build
      - name: Smoke test
        run: |
          sleep 5
          PORT=$(grep '^HTTP_PORT=' .env | cut -d= -f2)
          curl -fsS "http://localhost:${PORT:-8080}/api/health"
          echo
          curl -fsS "http://localhost:${PORT:-8080}/api/version"
