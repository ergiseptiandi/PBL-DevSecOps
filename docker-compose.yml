name: pbl-devsecops

# Topologi jaringan:
#   web  : nginx <-> frontend        (edge)
#   api  : nginx <-> backend-blue/green
#   data : backend <-> postgres SHARED (external net nginx-proxy-manager_default)
# DB tidak dibuat di sini — pakai Postgres shared yang sudah ada di server
# (container `postgres`, DB pbl_devsecops). Lihat .env.

services:
  backend-blue:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_COLOR: blue
      APP_VERSION: ${BACKEND_BLUE_VERSION:-1.0.0}
      # +psycopg2 eksplisit: SQLAlchemy 2.x default 'postgresql://' = psycopg3 (tidak terinstall)
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      RATE_LIMIT: ${RATE_LIMIT:-60/minute}
    networks:
      - api
      - nginx-proxy-manager_default

  backend-green:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_COLOR: green
      APP_VERSION: ${BACKEND_GREEN_VERSION:-1.1.0}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      RATE_LIMIT: ${RATE_LIMIT:-60/minute}
    networks:
      - api
      - nginx-proxy-manager_default

  frontend:
    build:
      context: ./frontend
      args:
        # BACKEND_URL di-bake saat build (rewrite /api di next.config.ts).
        # Lewat edge nginx agar switch blue/green otomatis ikut berlaku.
        BACKEND_URL: ${BACKEND_URL:-http://nginx:80}
    restart: unless-stopped
    networks:
      - web

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      # Backend yang "aktif" — diganti via scripts/switch-blue.sh | switch-green.sh
      ACTIVE_BACKEND: ${ACTIVE_BACKEND:-backend-blue:8000}
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      frontend:
        condition: service_healthy
      backend-blue:
        condition: service_healthy
      backend-green:
        condition: service_healthy
    networks:
      - web
      - api
      - nginx-proxy-manager_default

networks:
  web:
  api:
  nginx-proxy-manager_default:
    external: true
