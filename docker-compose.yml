name: pbl-devsecops

# Topologi jaringan sengaja dipisah:
#   web  : nginx <-> frontend        (edge)
#   api  : nginx <-> backend-blue/green
#   data : backend <-> db            (frontend & db tidak bisa saling bicara)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tasks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env — lihat .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-tasks}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  backend-blue:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_COLOR: blue
      APP_VERSION: ${BACKEND_BLUE_VERSION:-1.0.0}
      DATABASE_URL: postgresql://${POSTGRES_USER:-tasks}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tasks}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      RATE_LIMIT: ${RATE_LIMIT:-60/minute}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - api
      - data

  backend-green:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_COLOR: green
      APP_VERSION: ${BACKEND_GREEN_VERSION:-1.1.0}
      DATABASE_URL: postgresql://${POSTGRES_USER:-tasks}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tasks}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      RATE_LIMIT: ${RATE_LIMIT:-60/minute}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - api
      - data

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks:
      - web

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      # Backend yang "aktif" — diganti via scripts/switch-blue.sh | switch-green.sh
      ACTIVE_BACKEND: ${ACTIVE_BACKEND:-backend-blue:8000}
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      frontend:
        condition: service_healthy
      backend-blue:
        condition: service_healthy
      backend-green:
        condition: service_healthy
    networks:
      - web
      - api

volumes:
  db_data:

networks:
  web:
  api:
  data:
